name: Release

# Push a tag such as v1.0.0 to publish a release, or publish one by hand in the UI.
# Either way the release gets one zip per skill (the format Claude.ai's
# Settings → Capabilities → Skills upload expects) plus a zip of all skills.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'release' || !github.event.deleted }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Zip each skill
        run: |
          mkdir -p dist
          cd skills
          for dir in */; do
            name="${dir%/}"
            zip -qr "../dist/${name}.zip" "$name"
          done
          cd ..
          zip -qr dist/all-skills.zip skills

      - name: Create the release for a pushed tag
        if: github.event_name == 'push'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          elif [ -f ".github/release-notes/$TAG.md" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file ".github/release-notes/$TAG.md"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi

      - name: Upload the zips
        run: gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
