name: 🐛 Skill misbehaved
description: The skill did something it shouldn't (flattered you, stacked questions, invented facts, ignored your language…).
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Skill, agent or app, and model
      placeholder: "murder-board · Claude Code · claude-sonnet-… / DeepSeek web"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened (paste the relevant part of the conversation)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
