    <text x="68" y="312" fill="#f0f3f6" font-size="58" font-weight="800" letter-spacing="-1.5">by humans.</text>
    <text x="72" y="360" fill="#8b949e" font-size="18">Claude Code · Codex · Cursor · Gemini CLI · OpenClaw · ChatGPT · DeepSeek · Kimi</text>
  </g>
