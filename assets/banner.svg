<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Murder Board: get grilled by AI before you get grilled by humans">
  <title>Murder Board: get grilled by AI before you get grilled by humans</title>
  <defs>
    <radialGradient id="spot" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#ff4d5e" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff4d5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="100%" stop-color="#161b22"/>
