<rect width="860" height="554" rx="12" fill="#0d1117"/>
<circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
<text x="430.0" y="24" text-anchor="middle" fill="#8b949e" style="font-size:12px">灵魂拷问 · 立项评审演练</text>
<line x1="0" y1="38" x2="860" y2="38" stroke="#21262d"/>
<text class="l0" x="26" y="62" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">claude</tspan></text>
<text class="l1" x="26" y="83" xml:space="preserve"><tspan fill="#79c0ff">&gt; 灵魂拷问：下周三向一把手做项目立项汇报，材料在 ./立项汇报.pptx</tspan></text>
<text class="l3" x="26" y="125" xml:space="preserve"><tspan fill="#ff7b72" font-weight="700">● </tspan><tspan fill="#e6edf3" font-weight="700">侦察：评审团会看到这些</tspan></text>
<text class="l4" x="26" y="146" xml:space="preserve"><tspan fill="#8b949e">  你要什么：2000 万预算 + 15 个编制</tspan></text>
<text class="l5" x="26" y="167" xml:space="preserve"><tspan fill="#f0b429">  ⚠ 第 3 页收入预测 3000 万，没有测算依据</tspan></text>
<text class="l6" x="26" y="188" xml:space="preserve"><tspan fill="#f0b429">  ⚠ 去年同类项目预测 2000 万，实际只做到 600 万</tspan></text>
<text class="l7" x="26" y="209" xml:space="preserve"><tspan fill="#f0b429">  ⚠ 没有和外采方案做对比</tspan></text>
<text class="l9" x="26" y="251" xml:space="preserve"><tspan fill="#ff7b72">● </tspan><tspan fill="#e6edf3">评审团：</tspan><tspan fill="#8b949e">王总（一把手）· 李总（财务）· 张工（技术专家）· 赵总（兄弟部门）</tspan></text>
<text class="l11" x="26" y="293" xml:space="preserve"><tspan fill="#ff7b72">王总（一把手）：</tspan><tspan fill="#e6edf3">你说明年能带来 3000 万收入。去年同类项目也报了</tspan></text>
<text class="l12" x="26" y="314" xml:space="preserve"><tspan fill="#e6edf3">2000 万，最后只做到 600 万。这次凭什么信你？</tspan></text>
<text class="l14" x="26" y="356" xml:space="preserve"><tspan fill="#79c0ff">&gt; 去年主要是市场环境变化比较大，项目中途又调整了方向，再加上……</tspan></text>
<text class="l16" x="26" y="398" xml:space="preserve"><tspan fill="#e6edf3">直接性 </tspan><tspan fill="#ff7b72">●</tspan><tspan fill="#3b434d">○○○○</tspan><tspan fill="#e6edf3">  证据 </tspan><tspan fill="#ff7b72">●</tspan><tspan fill="#3b434d">○○○○</tspan><tspan fill="#e6edf3">  诚实 </tspan><tspan fill="#f0b429">●●●</tspan><tspan fill="#3b434d">○○</tspan><tspan fill="#e6edf3">  简洁 </tspan><tspan fill="#ff7b72">●●</tspan><tspan fill="#3b434d">○○○</tspan><tspan fill="#e6edf3">  镇定 </tspan><tspan fill="#f0b429">●●●</tspan><tspan fill="#3b434d">○○</tspan></text>
<text class="l17" x="26" y="419" xml:space="preserve"><tspan fill="#8b949e">诊断：你一开口就在解释原因。王总问的是“凭什么信你”，不是“为什么没做到”。</tspan></text>
<text class="l18" x="26" y="440" xml:space="preserve"><tspan fill="#56d364">你应该这么说：“您问得对，去年我们高估了渗透率。这次按 [对标车型实际数据]</tspan></text>
<text class="l19" x="26" y="461" xml:space="preserve"><tspan fill="#56d364">测算，并分两期投入：先投 800 万，[节点] 达标再投剩下的 1200 万。”</tspan></text>
<text class="l21" x="26" y="503" xml:space="preserve"><tspan fill="#8b949e">必死题剩余 8 道 · 当前准备度 41/100 · </tspan><tspan fill="#e6edf3">下一位：李总（财务）</tspan></text>
<rect class="cursor" x="26" y="510" width="8" height="16" fill="#8b949e"/>
</svg>
